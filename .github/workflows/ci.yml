name: CI

on:
  push:
    branches: ["main", "phase/**", "phase-2-production-reliability"]
  pull_request:
    branches: ["main"]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" pytest-cov
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Run Independent Evaluation Harness V2
        run: python -m app.evaluation.evaluator

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
